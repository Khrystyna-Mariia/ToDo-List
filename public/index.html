<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToDo List</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>Мій список завдань</h1>

    <div class="progress-wrap">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <p id="progress-label" class="progress-label"></p>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Введіть нове завдання..."
        autocomplete="off"
      />
      <button type="submit">Додати</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Усі</button>
      <button class="filter-btn" data-filter="active">Активні</button>
      <button class="filter-btn" data-filter="completed">Виконані</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state" hidden>Завдань поки немає. Додайте перше!</p>
    <p id="error-state" class="error-state" hidden></p>

    <div class="footer">
      <span id="task-count"></span>
      <button id="clear-completed" class="clear-btn">Очистити виконані</button>
    </div>
  </div>

  <div id="confetti-layer" class="confetti-layer"></div>

  <script src="app.js"></script>
</body>
</html>
