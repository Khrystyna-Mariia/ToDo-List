<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ToDo List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-layer bg-default active" data-theme="default"></div>
  <div class="bg-layer bg-todo" data-theme="todo"></div>
  <div class="bg-layer bg-in_progress" data-theme="in_progress"></div>
  <div class="bg-layer bg-paused" data-theme="paused"></div>
  <div class="bg-layer bg-done" data-theme="done"></div>

  <div class="app">
    <h1>Мій список завдань</h1>

    <div class="progress-wrap">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <p id="progress-label" class="progress-label"></p>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Введіть нове завдання..."
        autocomplete="off"
      />
      <select id="priority-input" class="priority-input" title="Пріоритет">
        <option value="low">🟢 Низький</option>
        <option value="medium" selected>🟡 Середній</option>
        <option value="high">🔴 Високий</option>
      </select>
      <button type="submit">Додати</button>
    </form>

    <div id="board" class="board"></div>

    <p id="empty-state" class="empty-state" hidden>Завдань поки немає. Додайте перше!</p>
    <p id="error-state" class="error-state" hidden></p>

    <div class="footer">
      <span id="task-count"></span>
      <button id="clear-completed" class="clear-btn">Очистити виконані</button>
    </div>
  </div>

  <div id="confetti-layer" class="confetti-layer"></div>

  <script src="app.js"></script>
</body>
</html>
